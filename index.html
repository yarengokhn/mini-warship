<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Warship</title>
  </head>

  <body>
    <div id="health-container">
      <div id="health-icon">⚓</div>
      <div id="health-bar"></div>
    </div>

    <div id="touch-hint">
      <div class="hint-card">
        <div class="hint-icon">👆</div>
        <div class="hint-text">
          <strong>Tap & drag to steer</strong>
          <span>Avoid obstacles and keep your ship alive.</span>
        </div>
      </div>
      <div class="hint-card">
        <div class="hint-icon">🔥</div>
        <div class="hint-text">
          <strong>Use the fire button</strong>
          <span>Tap the red button to shoot incoming enemies.</span>
        </div>
      </div>
      <div class="hint-subtext">Tap anywhere to start</div>
    </div>

    <div id="install-prompt">
      <h2>Ready for Battle?</h2>
      <p id="install-text">Play the mobile warship shooter now.</p>
      <button id="install-button" data-href="https://example.com">
        Install Now
      </button>
    </div>

    <div id="mobile-fire">
      <button id="fire-button">FIRE</button>
      <div class="fire-label">Tap to shoot</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
